 governance:T('Change request CR-001: a region asks to shorten onboarding by removing expert review. Decision: reject that removal; offer shorter navigation and targeted refreshers while keeping required evidence. Record impact, owner and version before release. Roll back to the last reviewed version if an error is found.','Änderung CR-001: Eine Region möchte die Fachprüfung streichen, um das Onboarding zu verkürzen. Entscheidung: Streichung ablehnen; kürzere Navigation und gezielte Auffrischung anbieten, erforderliche Nachweise erhalten. Auswirkungen, Zuständigkeit und Version vor Freigabe dokumentieren. Bei Fehlern auf die letzte geprüfte Version zurücksetzen.','Değişiklik CR-001: Bir bölge onboarding süresini azaltmak için uzman incelemesini kaldırmak istiyor. Karar: incelemeyi kaldırmayı reddet; gerekli kanıtları koruyarak kısa gezinme ve hedefli tekrar öner. Yayından önce etki, sorumlu ve sürümü kaydet. Hata bulunursa son incelenen sürüme dön.'),
 scenarios:[
 {title:T('MR onboarding','MR-Onboarding','MR onboarding'),body:T('The course is complete, but the learning record has an unanswered question about the applicable resource. What should happen?','Der Kurs ist abgeschlossen, aber im Lernprotokoll ist eine Frage zur passenden Ressource offen. Was soll geschehen?','Kurs tamamlandı, ancak öğrenme kaydında uygun kaynakla ilgili yanıtlanmamış soru var. Ne yapılmalı?'),choices:T(['Close the question because the course is complete','Keep it pending and send contextual information to the designated expert','Remove the question from the report'],['Frage schließen, weil der Kurs abgeschlossen ist','Offen halten und Kontext an die zuständige Fachperson übergeben','Frage aus dem Bericht entfernen'],['Kurs tamamlandığı için soruyu kapat','Beklemede tut ve bağlamı yetkili uzmana ilet','Soruyu rapordan kaldır']),correct:1,why:T('Completion is not evidence that uncertainty has been resolved. Preserve the gap and assign an accountable reviewer.','Abschluss belegt nicht, dass Unsicherheit geklärt ist. Lücke erhalten und verantwortliche Fachprüfung zuweisen.','Tamamlama, belirsizliğin çözüldüğünü kanıtlamaz. Eksikliği koru ve sorumlu değerlendiriciye yönlendir.')},
 {title:T('Software workflow','Softwareablauf','Yazılım iş akışı'),body:T('A learner opens a guide for version 2 while the fictional training environment uses version 3. No approved mapping is available.','Eine lernende Person öffnet eine Anleitung für Version 2, die fiktive Lernumgebung nutzt Version 3. Eine freigegebene Zuordnung fehlt.','Öğrenen sürüm 2 kılavuzunu açıyor; kurgusal eğitim ortamı sürüm 3 kullanıyor. Onaylı eşleştirme yok.'),choices:T(['Use the older guide without checking','Generate missing instructions automatically','Pause the affected activity and request a version-matched approved source'],['Alte Anleitung ungeprüft verwenden','Fehlende Anleitung automatisch generieren','Betroffene Aktivität pausieren und passende freigegebene Quelle anfordern'],['Eski kılavuzu kontrol etmeden kullan','Eksik talimatları otomatik üret','İlgili etkinliği durdur ve sürüme uygun onaylı kaynak iste']),correct:2,why:T('Source applicability is a release dependency. AI or learner confidence cannot substitute for version review.','Quellengültigkeit ist eine Freigabevoraussetzung. KI oder Selbstvertrauen ersetzen keine Versionsprüfung.','Kaynak uygunluğu yayın ön koşuludur. AI veya öğrenenin özgüveni sürüm incelemesinin yerini tutmaz.')},
 {title:T('Remote-support education','Remote-Support-Schulung','Uzaktan destek eğitimi'),body:T('An educator receives a recurring learning question without the module ID, version or previous steps. What improves the handoff?','Eine wiederkehrende Lernfrage geht ohne Modul-ID, Version oder bisherige Schritte ein. Was verbessert die Übergabe?','Eğitimciye modül kimliği, sürüm veya önceki adımlar olmadan tekrarlanan bir öğrenme sorusu geliyor. Devir nasıl iyileşir?'),choices:T(['Capture module, version and attempted steps; route to the designated role','Mark the learner as competent','Forward an empty ticket to every department'],['Modul, Version und bisherige Schritte erfassen; zuständig zuweisen','Person als kompetent markieren','Leeres Ticket an alle Abteilungen senden'],['Modül, sürüm ve denenen adımları kaydet; sorumlu role ilet','Öğreneni yetkin olarak işaretle','Boş talebi tüm birimlere gönder']),correct:0,why:T('A structured service handoff reduces clarification loops. It remains an educational query, not a clinical escalation system.','Strukturierte Übergabe reduziert Rückfrageschleifen. Es bleibt eine Lernfrage, kein klinisches Eskalationssystem.','Yapılandırılmış servis devri açıklama döngülerini azaltmayı hedefler. Bu eğitim sorusudur; klinik yönlendirme sistemi değildir.')}

 metricsNote:T('Synthetic cohorts only. Success is successful / observed, not successful / completed. Gap closure is closed / reassessed; show reassessment coverage alongside it. No before/after causal effect is claimed.','Nur synthetische Gruppen. Erfolg = erfolgreich / beobachtet, nicht erfolgreich / abgeschlossen. Lückenschluss = geschlossen / neu bewertet; Abdeckung mitanzeigen. Kein kausaler Vorher-Nachher-Effekt wird behauptet.','Yalnızca sentetik gruplar. Başarı = başarılı / gözlenen; başarılı / tamamlayan değil. Eksik kapatma = kapatılan / yeniden değerlendirilen; kapsamıyla birlikte gösterilir. Önce-sonra nedensel etki iddia edilmez.'),
 pilot:T('Proposed pilot: 8–12 consenting adult volunteers complete fictional learning tasks. Record assistance, first-attempt accuracy, task time and qualitative confusion. Test a revised version with participant overlap disclosed. At 30 days use a new task if feasible. Targets: ≥80% unassisted task success and no unresolved critical usability defect. Targets are not achieved results; convenience sampling and practice effects limit inference.','Vorgeschlagener Pilot: 8–12 einwilligende Erwachsene bearbeiten fiktive Lernaufgaben. Hilfe, Erstversuchsgenauigkeit, Zeit und Unklarheiten erfassen. Überarbeitete Version testen und wiederholte Teilnahme offenlegen. Nach 30 Tagen möglichst eine neue Aufgabe. Ziele: ≥80% selbstständiger Erfolg und keine offenen kritischen Bedienprobleme. Keine erzielten Ergebnisse; Gelegenheitsstichprobe und Übungseffekte begrenzen Aussagen.','Önerilen pilot: 8–12 gönüllü yetişkin kurgusal görevleri tamamlar. Yardım, ilk deneme doğruluğu, süre ve karışıklıklar kaydedilir. Düzeltilen sürüm tekrar katılanlar belirtilerek test edilir. Mümkünse 30 gün sonra yeni görev uygulanır. Hedef: ≥%80 yardımsız başarı ve açık kritik kullanılabilirlik hatası olmaması. Bunlar gerçekleşmiş sonuç değildir; uygun örneklem ve alıştırma etkisi çıkarımı sınırlar.'),

const l=x=>x&&typeof x==='object'&&!Array.isArray(x)&&'en'in x?x[lang]:x;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=x=>esc(l(x));
function cell(x){return '<td>'+text(x)+'</td>';}
function table(headers,rows){return '<div class="table-scroll"><table><thead><tr>'+l(headers).map(x=>'<th scope="col">'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(cell).join('')+'</tr>').join('')+'</tbody></table></div>';}
function cards(rows){return '<div class="cards">'+rows.map((r,i)=>'<article class="card"><span class="number">'+String(i+1).padStart(2,'0')+'</span><h3>'+text(r[0])+'</h3><p>'+text(r[1])+'</p></article>').join('')+'</div>';}
function btn(label,attrs=''){return '<button '+attrs+'>'+text(label)+'</button>';}
function heading(title,desc){return '<div class="section-head"><h2 tabindex="-1">'+text(title)+'</h2>'+(desc?'<p>'+text(desc)+'</p>':'')+'</div>';}
function ratio(n,d){return d?100*n/d:null;}
function metrics(a){return [ratio(a[1],a[0]),ratio(a[3],a[2]),ratio(a[2],a[0]),ratio(a[6],a[5]),ratio(a[5],a[4])];}
function model(c){const gross=c.learners*c.hours*c.hourly,total=c.build+c.support;return [gross,gross-total,total?100*(gross-total)/total:null];}
function release(g){return g.every(Boolean);}
function clampCohort(a){a=a.map(x=>Math.max(0,Math.round(Number(x)||0)));a[1]=Math.min(a[1],a[0]);a[2]=Math.min(a[2],a[1]);a[3]=Math.min(a[3],a[2]);a[4]=Math.min(a[4],a[0]);a[5]=Math.min(a[5],a[4]);a[6]=Math.min(a[6],a[5]);return a;}
const percent=n=>n===null?'—':new Intl.NumberFormat(lang,{maximumFractionDigits:1}).format(n)+'%';
const money=n=>new Intl.NumberFormat(lang,{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
