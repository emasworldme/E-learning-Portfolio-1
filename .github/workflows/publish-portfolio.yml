name: Publish portfolio
on:
  push:
    paths:
      - 'Amine_Merve_Ercan_Portfolio_Femalepreneurship_Game_Link (1).zip'
      - '.github/workflows/publish-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract portfolio
        run: |
          unzip -o "Amine_Merve_Ercan_Portfolio_Femalepreneurship_Game_Link (1).zip" -d /tmp/portfolio
          cp -a /tmp/portfolio/. .
          rm -f "Amine_Merve_Ercan_Portfolio_Femalepreneurship_Game_Link (1).zip"
      - name: Commit extracted site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish portfolio website"
          git push
